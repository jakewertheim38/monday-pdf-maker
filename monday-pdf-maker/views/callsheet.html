<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Call Sheet</title>
<style>
  body { font-family: sans-serif; padding: 20px; }
  .step { margin: 10px 0; padding: 8px 12px; border-radius: 6px; background: #f0f0f0; }
  .ok { background: #e6f4ea; color: #166534; }
  .err { background: #fde8ec; color: #9b1c31; }
  button { font-family: inherit; font-size: 14px; padding: 10px 20px; background: #0073ea; color: white; border: none; border-radius: 6px; cursor: pointer; margin-top: 12px; }
</style>
</head>
<body>
<h2>Call Sheet — Diagnostics</h2>
<div id="steps"></div>

<script src="https://cdn.jsdelivr.net/npm/monday-sdk-js@0.5.5/dist/main.js"></script>
<script>
const steps = document.getElementById('steps');
function log(msg, ok) {
  const d = document.createElement('div');
  d.className = 'step ' + (ok === true ? 'ok' : ok === false ? 'err' : '');
  d.textContent = msg;
  steps.appendChild(d);
}

log('Page loaded');

// Step 1: SDK available?
if (window.mondaySdk) {
  log('monday SDK loaded ✓', true);
} else {
  log('monday SDK NOT loaded ✗', false);
}

// Step 2: Init SDK
let monday = null;
try {
  monday = window.mondaySdk();
  log('monday SDK initialised ✓', true);
} catch(e) {
  log('SDK init failed: ' + e.message, false);
}

// Step 3: Get context
if (monday) {
  log('Requesting context...');
  monday.listen('context', (res) => {
    log('Context received: itemId=' + (res.data && res.data.itemId), true);
  });
  setTimeout(() => {
    const existing = steps.querySelectorAll('.ok');
    if (existing.length < 3) log('Context timeout after 5s — not inside a monday item view', false);
  }, 5000);
}

// Step 4: Get session token
if (monday) {
  log('Requesting session token...');
  monday.get('sessionToken').then(res => {
    log('Session token received: ' + (res.data ? res.data.slice(0,20) + '...' : 'empty'), !!res.data);
  }).catch(e => {
    log('Session token failed: ' + e.message, false);
  });
  setTimeout(() => {
    log('Session token timeout after 8s', false);
  }, 8000);
}

// Step 5: Fetch auth-status
log('Fetching auth-status from server...');
fetch('https://live1-service-29120331-f5082871.eu.monday.app/api/callsheet/auth-status')
  .then(r => r.json())
  .then(j => log('Auth status: authorised=' + j.authorised, j.authorised))
  .catch(e => log('Auth status fetch failed: ' + e.message, false));

// Manual connect button
const btn = document.createElement('button');
btn.textContent = 'Connect monday account (manual)';
btn.onclick = () => {
  window.open('https://auth.monday.com/oauth2/authorize?client_id=dacc85f498b5b99ba0798eaad01682cc&redirect_uri=' + encodeURIComponent('https://live1-service-29120331-f5082871.eu.monday.app/oauth/callback'), 'oauth', 'width=600,height=700');
};
document.body.appendChild(btn);
</script>
</body>
</html>
