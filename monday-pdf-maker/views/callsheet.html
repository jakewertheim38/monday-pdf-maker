<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Call Sheet</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/monday-sdk-js@0.5.5/dist/main.js"></script>
<style>
  :root {
    --bg: #ffffff; --panel: #f6f7fb; --text: #323338; --muted: #676879;
    --border: #d0d4e4; --teal: #003942; --primary: #0073ea; --primary-h: #0060b9;
    --ok: #00854d; --err: #d83a52; --shadow: 0 4px 16px rgba(0,0,0,.1);
  }
  body.dark  { --bg:#181b34; --panel:#22264a; --text:#d5d8df; --muted:#9699a6; --border:#3b3f63; }
  body.black { --bg:#111; --panel:#1c1c1c; --text:#eee; --muted:#a0a0a0; --border:#3a3a3a; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Figtree, -apple-system, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }

  /* ── Header ── */
  .header { padding: 16px 20px 0; }
  .shoot-name { font-size: 20px; font-weight: 700; line-height: 1.2; }
  .shoot-meta { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 4px; color: var(--muted); font-size: 13px; }
  .chip { background: var(--teal); color: #fff; border-radius: 4px; padding: 2px 8px; font-size: 11px; font-weight: 600; }
  .info-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px,1fr)); gap: 8px; padding: 12px 20px; }
  .info-card { background: var(--panel); border-radius: 6px; padding: 8px 10px; }
  .info-card .lbl { font-size: 11px; color: var(--muted); margin-bottom: 2px; }
  .info-card .val { font-weight: 600; font-size: 13px; }

  /* ── Tabs ── */
  .tabs { display: flex; gap: 0; border-bottom: 2px solid var(--border); padding: 0 20px; margin-top: 4px; }
  .tab { padding: 10px 16px; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; white-space: nowrap; }
  .tab.active { color: var(--teal); border-bottom-color: var(--teal); }
  .tab:hover:not(.active) { color: var(--text); }

  /* ── Tab panels ── */
  .panel { display: none; padding: 16px 20px 32px; }
  .panel.active { display: block; }

  /* ── PDF grid ── */
  .dl-section { padding: 12px 20px 4px; }
  .dl-heading { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 10px; display: flex; align-items: center; gap: 5px; }
  .dl-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap: 8px; }
  .dl-card { background: var(--panel); border: 0.5px solid var(--border); border-radius: 8px; padding: 11px 13px; text-align: left; cursor: pointer; display: flex; align-items: center; gap: 10px; font-family: inherit; transition: background .1s; }
  .dl-card:hover:not(:disabled) { background: var(--border); }
  .dl-card:disabled { opacity: .5; cursor: not-allowed; }
  .dl-card .icon { font-size: 20px; color: var(--primary); flex-shrink: 0; }
  .dl-card .name { font-size: 13px; font-weight: 600; color: var(--text); line-height: 1.2; }
  .dl-card .sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
  button { font-family: inherit; font-size: 13px; cursor: pointer; border-radius: 6px; border: 1px solid transparent; padding: 6px 12px; }
  button:disabled { opacity: .5; cursor: not-allowed; }

  /* ── Tables ── */
  .section-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 16px 0 8px; }
  .section-title:first-child { margin-top: 0; }
  .tbl-wrap { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-bottom: 16px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { background: var(--panel); color: var(--muted); font-weight: 600; font-size: 11px; text-align: left; padding: 7px 12px; border-bottom: 1px solid var(--border); }
  td { padding: 8px 12px; border-top: 1px solid var(--border); vertical-align: top; }
  tr:first-child td { border-top: 0; }
  .empty-row td { color: var(--muted); text-align: center; padding: 20px; }

  /* Settings drawer */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; z-index: 10; }
  .overlay.open { display: block; }
  .drawer { position: fixed; top:0; right:0; bottom:0; width: min(500px,100%); background: var(--bg); box-shadow: var(--shadow); z-index: 11; transform: translateX(100%); transition: transform .2s; display: flex; flex-direction: column; }
  .drawer.open { transform: none; }
  .drawer-head { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .drawer-head h3 { font-size: 16px; }
  .drawer-body { padding: 8px 18px 18px; overflow-y: auto; flex: 1; }
  .drawer-foot { padding: 12px 18px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: space-between; }
  .btn-secondary { background: transparent; color: var(--text); border-color: var(--border); }
  .btn-secondary:hover:not(:disabled) { background: var(--panel); }
  .group-title { font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 16px 0 8px; }
  .field { display: grid; grid-template-columns: 1fr 1.3fr; gap: 10px; align-items: center; margin-bottom: 8px; }
  .field label { font-size: 13px; }
  .hint { display: block; color: var(--muted); font-size: 11px; }
  select { width: 100%; font-family: inherit; font-size: 13px; padding: 5px 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); }
  .intro { color: var(--muted); font-size: 13px; margin: 6px 0 4px; }

  /* Toast & spinner */
  .toast { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); background: #323338; color: #fff; padding: 9px 14px; border-radius: 8px; display: none; z-index: 20; font-size: 13px; }
  .toast.show { display: block; }
  .toast.ok  { background: var(--ok); }
  .toast.err { background: var(--err); }
  .spinner { width: 24px; height: 24px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; margin: 40px auto 10px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-msg { text-align: center; color: var(--muted); }
  .error-box { background: #fde8ec; color: #9b1c31; padding: 12px 14px; border-radius: 8px; margin: 16px 20px; }
  body.dark .error-box, body.black .error-box { background: #4a1d27; color: #ffc2cc; }

  /* top bar */
  .top-bar { display: flex; justify-content: space-between; align-items: flex-start; padding: 16px 20px 0; }
  .icon-btn { background: transparent; border: 1px solid var(--border); color: var(--text); padding: 5px 10px; display: flex; align-items: center; gap: 5px; font-size: 12px; }
  .icon-btn:hover { background: var(--panel); }
</style>
</head>
<body>

<div id="loading"><div class="spinner"></div><p class="loading-msg">Loading call sheet…</p></div>
<div id="main" style="display:none">
  <div class="top-bar">
    <div>
      <div class="shoot-name" id="shootName"></div>
      <div class="shoot-meta" id="shootMeta"></div>
    </div>
    <button class="icon-btn" id="openSettings">⚙️ Settings</button>
  </div>
  <div class="info-row" id="infoRow"></div>

  <div class="dl-section"><div class="dl-heading">⬇ Download</div><div class="dl-grid" id="pdf-bar"></div></div>
  <div class="tabs">
    <div class="tab active" data-tab="callsheet">Call Sheet</div>
    <div class="tab" data-tab="schedule">Schedule</div>
    <div class="tab" data-tab="roles">Roles &amp; Responsibilities</div>
  </div>

  <!-- Call Sheet tab -->
  <div class="panel active" id="tab-callsheet">
    <div class="section-title">Crew</div>
    <div class="tbl-wrap">
      <table id="crew-table">
        <thead><tr><th>Name</th><th>Position</th><th>Call Time</th><th>Wrap</th><th>Email</th><th>Note</th></tr></thead>
        <tbody id="crew-body"></tbody>
      </table>
    </div>
    <div class="section-title">Talent</div>
    <div class="tbl-wrap">
      <table id="talent-table">
        <thead><tr><th>Name</th><th>Call Time</th><th>Wrap</th><th>Note</th></tr></thead>
        <tbody id="talent-body"></tbody>
      </table>
    </div>
  </div>

  <!-- Schedule tab -->
  <div class="panel" id="tab-schedule">
    <div class="tbl-wrap">
      <table id="schedule-table">
        <thead><tr><th>Date</th><th>Time</th><th>Scene</th><th>Location</th><th>Description</th><th>Still/Video</th><th>Talent</th><th>Clothing</th></tr></thead>
        <tbody id="schedule-body"></tbody>
      </table>
    </div>
  </div>

  <!-- R&R tab -->
  <div class="panel" id="tab-roles">
    <div class="tbl-wrap">
      <table id="roles-table">
        <thead><tr><th>Name</th><th>Position</th><th>Responsibility</th></tr></thead>
        <tbody id="roles-body"></tbody>
      </table>
    </div>
  </div>
</div>

<div id="errorBox" style="display:none" class="error-box"></div>

<!-- Settings -->
<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head"><h3>Column settings</h3><button class="btn-secondary" id="closeSettings">✕</button></div>
  <div class="drawer-body" id="settingsBody"></div>
  <div class="drawer-foot">
    <button class="btn-secondary" id="resetSettings">Reset to defaults</button>
    <div style="display:flex;gap:8px">
      <button class="btn-secondary" id="cancelSettings">Cancel</button>
      <button class="btn-save" id="saveSettings">Save</button>
    </div>
  </div>
</aside>
<div class="toast" id="toast"></div>

<script>
(function () {
  const monday = window.mondaySdk ? window.mondaySdk() : null;
  const state = { itemId: null, boardId: null, data: null, settings: null };
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const pad = (n) => String(n ?? 0).padStart(2,'0');
  const fmtTime = (t) => t && t.hour != null ? pad(t.hour) + ':' + pad(t.minute) : '—';
  const fmtDate = (d) => {
    if (!d) return '—';
    const dt = new Date((d.from || d) + 'T12:00:00Z');
    return isNaN(dt) ? d : dt.toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short'});
  };

  function toast(msg, kind) {
    const t = $('toast'); t.textContent = msg; t.className = 'toast show ' + (kind||'');
    clearTimeout(toast._t); toast._t = setTimeout(() => t.className='toast', kind==='err'?6000:3000);
  }

  async function sessionToken() { const r = await monday.get('sessionToken'); return r.data; }

  async function api(path, options={}) {
    const token = await sessionToken();
    const res = await fetch(path, { ...options, headers: {'Content-Type':'application/json', Authorization: token, ...(options.headers||{})} });
    if (!res.ok) { let m = 'Error ' + res.status; try { m = (await res.json()).error || m; } catch(_){} throw new Error(m); }
    return res;
  }

  // ── Tabs ──
  document.querySelectorAll('.tab').forEach(tab => {
    tab.onclick = () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      tab.classList.add('active');
      $('tab-' + tab.dataset.tab).classList.add('active');
    };
  });

  // ── Render ──
  function row(...cells) { return '<tr>' + cells.map(c => '<td>' + esc(c) + '</td>').join('') + '</tr>'; }
  function emptyRow(cols, msg) { return `<tr class="empty-row"><td colspan="${cols}">${msg}</td></tr>`; }

  function pdfButtons(kinds, containerId) {
    const d = state.data;
    $(containerId).innerHTML = kinds.map(kind => {
      const doc = d.docs.find(x => x.kind === kind);
      if (!doc) return '';
      const hasSave = d.saveTo[kind];
      return `<button class="dl-card" data-kind="${kind}">
        <span class="icon" aria-hidden="true">&#128196;</span>
        <span><span class="name" data-label="${esc(doc.label)}">${esc(doc.label)}</span><span class="sub">${hasSave ? 'Saves to item' : 'Download only'}</span></span>
      </button>`;
    }).join('');
    $(containerId).querySelectorAll('button').forEach(b => b.onclick = () => makePdf(b));
  }

  function render() {
    const d = state.data;
    const it = d.item;

    // Header
    $('shootName').textContent = it.name || '—';
    $('shootMeta').innerHTML = (it.productionId ? `<span class="chip">${esc(it.productionId)}</span>` : '') +
      `<span>${fmtDate(it.shootDate)}</span>`;

    // Info cards
    const cards = [
      ['Producer', it.producer], ['Project Manager', it.projectManager],
      ['Location', it.location], ['Crew Call', fmtTime(it.crewCallTime)], ['Talent Call', fmtTime(it.talentCallTime)],
    ];
    $('infoRow').innerHTML = cards.map(([l,v]) =>
      `<div class="info-card"><div class="lbl">${esc(l)}</div><div class="val">${esc(v||'—')}</div></div>`
    ).join('');

    // PDF buttons above tabs
    pdfButtons(d.docs.map(x => x.kind), 'pdf-bar');

    // Crew table
    $('crew-body').innerHTML = d.crew && d.crew.length
      ? d.crew.map(c => row(c.name, c.position||'—', fmtTime(c.callTime), fmtTime(c.wrapTime), c.email||'—', c.note||'')).join('')
      : emptyRow(6, 'No crew found — check the Crew / Talent column in ⚙️ Settings');

    // Talent table
    $('talent-body').innerHTML = d.talent && d.talent.length
      ? d.talent.map(t => row(t.name, fmtTime(t.callTime), fmtTime(t.wrapTime), t.note||'')).join('')
      : emptyRow(4, 'No talent found');

    // Schedule table
    $('schedule-body').innerHTML = d.schedule && d.schedule.length
      ? d.schedule.map(s => row(fmtDate(s.date), `${fmtTime(s.timeStart)} – ${fmtTime(s.timeEnd)}`, s.scene||'—', s.location||'—', s.description||'—', s.stillVideo||'—', s.talent||'—', s.clothing||'—')).join('')
      : emptyRow(8, 'No schedule items found — subitems need Type set to "Schedule"');

    // Roles table
    $('roles-body').innerHTML = d.roles && d.roles.length
      ? d.roles.map(r => row(r.name, r.position||'—', r.responsibility||'—')).join('')
      : emptyRow(3, 'No roles found — subitems need a Responsibility filled in');

    $('loading').style.display = 'none';
    $('main').style.display = 'block';
  }

  async function makePdf(button) {
    const kind = button.dataset.kind;
    const nameEl = button.querySelector('.name');
    const orig = nameEl.textContent;
    button.disabled = true;
    nameEl.textContent = 'Generating…';
    try {
      const res = await api('/api/callsheet/pdf', { method:'POST', body: JSON.stringify({ itemId: state.itemId, kind }) });
      const blob = await res.blob();
      const name = decodeURIComponent(res.headers.get('X-Filename') || kind + '.pdf');
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href=url; a.download=name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
      toast('Saved to item and downloaded', 'ok');
    } catch(e) { toast(e.message, 'err'); }
    finally { button.disabled = false; nameEl.textContent = orig; }
  }

  async function load() {
    try {
      const res = await api('/api/callsheet/item?itemId=' + state.itemId + '&boardId=' + state.boardId);
      state.data = await res.json();
      if (state.data.boardId) state.boardId = state.data.boardId;
      render();
    } catch(e) {
      $('loading').style.display = 'none';
      const eb = $('errorBox'); eb.style.display = 'block';
      eb.innerHTML = '<strong>Couldn\'t load the call sheet.</strong><br>' + esc(e.message);
    }
  }

  // ── Settings ──
  async function openSettings() {
    $('settingsBody').innerHTML = '<div class="spinner"></div>';
    $('overlay').classList.add('open'); $('drawer').classList.add('open');
    try {
      const res = await api('/api/callsheet/settings?boardId=' + state.boardId);
      state.settings = await res.json();
      renderSettings(state.settings.current);
    } catch(e) { $('settingsBody').innerHTML = '<div class="error-box">' + esc(e.message) + '</div>'; }
  }

  function renderSettings(values) {
    const s = state.settings;
    if (!s || !Array.isArray(s.fields)) { $('settingsBody').innerHTML = '<div class="error-box">Could not load settings.</div>'; return; }
    const groups = [];
    s.fields.forEach(f => { let g = groups.find(x => x.name===f.group); if(!g) groups.push(g={name:f.group,fields:[]}); g.fields.push(f); });
    const options = f => {
      const cols = f.level==='subitem' ? s.subitemColumns : s.columns;
      const current = values[f.key] || '';
      const fits = cols.filter(c => f.types.includes(c.type) || c.id===current);
      return '<option value="">— Not used —</option>' + fits.map(c => `<option value="${esc(c.id)}"${c.id===current?' selected':''}>${esc(c.title)}</option>`).join('');
    };
    $('settingsBody').innerHTML = `<p class="intro">Column mappings for <strong>${esc(s.boardName)}</strong>. Saved settings are shared with the workflow blocks.</p>` +
      groups.map(g => `<div class="group-title">${esc(g.name)}</div>` +
        g.fields.map(f => `<div class="field"><label for="f_${f.key}">${esc(f.label)}${f.hint?`<span class="hint">${esc(f.hint)}</span>`:''}</label><select id="f_${f.key}" data-key="${f.key}"${s.canEdit?'':' disabled'}>${options(f)}</select></div>`).join('')
      ).join('');
    $('saveSettings').disabled = !s.canEdit;
    $('resetSettings').disabled = !s.canEdit;
  }

  function closeSettings() { $('overlay').classList.remove('open'); $('drawer').classList.remove('open'); }

  $('openSettings').onclick = openSettings;
  $('closeSettings').onclick = closeSettings;
  $('cancelSettings').onclick = closeSettings;
  $('overlay').onclick = closeSettings;
  document.addEventListener('keydown', e => { if (e.key==='Escape') closeSettings(); });

  $('saveSettings').onclick = async () => {
    const mapping = {};
    document.querySelectorAll('#settingsBody select').forEach(sel => mapping[sel.dataset.key]=sel.value);
    $('saveSettings').disabled = true;
    try { await api('/api/callsheet/settings',{method:'POST',body:JSON.stringify({boardId:state.boardId,mapping})}); toast('Settings saved','ok'); closeSettings(); load(); }
    catch(e) { toast(e.message,'err'); }
    finally { $('saveSettings').disabled = false; }
  };
  $('resetSettings').onclick = async () => {
    if (!confirm('Reset all columns back to defaults?')) return;
    $('resetSettings').disabled = true;
    try { await api('/api/callsheet/settings',{method:'POST',body:JSON.stringify({boardId:state.boardId,mapping:{}})}); toast('Reset to defaults','ok'); closeSettings(); load(); }
    catch(e) { toast(e.message,'err'); }
    finally { $('resetSettings').disabled = false; }
  };

  // ── Start ──
  if (!monday) { $('loading').innerHTML = '<div class="error-box">This page only works inside monday.com.</div>'; return; }
  let started = false;
  monday.listen('context', res => {
    const ctx = res.data || {};
    document.body.className = ctx.theme==='dark'?'dark':ctx.theme==='black'?'black':'';
    const itemId = ctx.itemId || (ctx.itemIds && ctx.itemIds[0]);
    if (!itemId) return;
    const changed = String(itemId) !== String(state.itemId);
    state.itemId = itemId; state.boardId = ctx.boardId || (ctx.boardIds && ctx.boardIds[0]);
    if (!started || changed) { started=true; load(); }
  });
  setTimeout(() => { if (!started) $('loading').innerHTML = '<div class="error-box">Couldn\'t get the item from monday. Open this from an item\'s view tab.</div>'; }, 8000);
})();
</script>
</body>
</html>
