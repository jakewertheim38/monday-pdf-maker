      - name: Deploy to monday code
        env:
          MONDAY_TOKEN: ${{ secrets.MONDAY_TOKEN }}
        run: |
          TOKEN=$(printf '%s' "$MONDAY_TOKEN" | tr -s ' \n\r\t' '\n' | tail -n 1)
          mapps init -t "$TOKEN"

          PKG=$(find . -name package.json -not -path '*/node_modules/*' -not -path './.git/*' | head -n 1)
          if [ -z "$PKG" ]; then
            echo "::error::package.json not found"
            exit 1
          fi
          APP_DIR=$(dirname "$PKG")
          echo "Deploying from: $APP_DIR"

          # List versions and show raw output so we can see the format
          echo "=== Version list ==="
          mapps app-version:list -i 12222663 2>&1 || true
          echo "=== End version list ==="

          VERSION_ID=$(mapps app-version:list -i 12222663 2>/dev/null | grep -i "draft" | grep -oE '\b[0-9]{7,9}\b' | grep -v '^12222663$' | tail -1)
          if [ -z "$VERSION_ID" ]; then
            echo "::error::No draft version found. Create a new draft version in the Developer Center."
            exit 1
          fi
          echo "Deploying to version: $VERSION_ID"
          mapps code:push -i "$VERSION_ID" -d "$APP_DIR"
